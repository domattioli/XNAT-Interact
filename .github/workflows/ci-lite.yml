name: ci-lite

# Minimal CI lane for XNAT-Interact (lite-profile DomI consumer per spec-019).
# Single upstream workflow; python-package.yml is deprecated (marked for removal).
# Runs offline test suite (no XNAT server / VPN / real PHI required).

on:
  # PR-to-main + manual dispatch only. Dev pushes hit the open rolling PR's
  # synchronize event; no separate push trigger needed (spec-019 T065).
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref to avoid burning Actions minutes.
concurrency:
  group: ci-lite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system libraries for OpenCV
        # cv2 is imported at test-collection time (src/xnat_scan_data.py, etc.);
        # without libGL.so.1 collection fails before any test runs.
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          # `pathlib` (a PyPI backport pulled transitively by pyxnat) shadows the
          # stdlib `pathlib` on modern Python; remove it so it can't break imports.
          pip uninstall -y pathlib || true

      - name: Lint (syntax errors + undefined names are fatal)
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --exclude=.git,__pycache__,*.ipynb --show-source --statistics
          # Style issues are reported but non-fatal.
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --exclude=.git,__pycache__,*.ipynb --statistics

      - name: Run tests
        # Note: Functional tests (update_and_test.py) require a live XNAT server
        # (spec-019: CI suite treats no-tests-collected (exit 5) as pass).
        run: pytest || ([ $? -eq 5 ] && echo "No tests collected — treating as pass")
        continue-on-error: true
