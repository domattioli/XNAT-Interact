# DEPRECATED (spec-019 T057 mark-stage): superseded by ci-lite.yml.
# False comment "no pytest suite" below is obsolete — 65 test files exist.
# Removal after 1-cycle grace (workflows/ci-lite.yml is canonical).
# Contact operator before removing; other workflows may reference this name.
#
# TODO: Delete this file after promoting ci-lite.yml to canonical + updating any references.

name: Python Package [DEPRECATED]

on:
  # MINIMAL CI — dispatch only (manual trigger for troubleshooting).
  # This workflow is superseded; use ci-lite.yml instead.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 pytest
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        # exit code 5 = "no tests collected" — the repo's functional test
        # (update_and_test.py) needs a live XNAT server, so there is no
        # pytest suite yet. Treat no-tests as pass; any real failure still fails.
        pytest || ([ $? -eq 5 ] && echo "No tests collected — treating as pass")
