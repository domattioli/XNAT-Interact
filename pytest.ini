[pytest]
# update_and_test.py is a manual run-tool (it drives a live XNAT server and
# imports pkg_resources at module top), NOT a pytest suite. Pytest's default
# collection globs include *_test.py, which matches update_and_test.py and
# fails at import. Restrict collection to test_*.py so that file is ignored.
# No unit-test suite exists yet -> pytest collects 0 items (exit 5), which the
# CI step treats as a pass.
python_files = test_*.py
