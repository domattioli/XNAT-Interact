[pytest]
# XNAT-Interact test configuration.
# All tests under tests/ run offline (no XNAT server / VPN / real PHI).
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -ra
markers =
    requires_server: test needs a live XNAT server / VPN (skipped by default in CI).
    known_issue: documents current (buggy) behavior that the improvement plan will fix.
