[pytest]
# XNAT-Interact test configuration.
# All tests under tests/ run offline (no XNAT server / VPN / real PHI).
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -ra
markers =
    requires_server: test needs a live XNAT server / VPN (skipped by default in CI).
    known_issue: documents current (buggy) behavior that the improvement plan will fix.
    contract: contract test ensuring FakeXNAT ≈ real XNAT behavioral parity (Phase 6).
    slow: slow test (e.g. throughput timing); deselect in the default lane via -m "not slow".
    pg: requires a live Postgres instance via XNAT_REGISTRY_PG_DSN env var; skip offline.
    pixeldeid: burned-in-PHI pixel de-id test needing heavy deps (Tesseract, spaCy, onnxruntime); opt-in CPU lane.
