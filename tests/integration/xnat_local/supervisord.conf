[supervisord]
nodaemon=true

[program:postgresql]
command=/usr/lib/postgresql/14/bin/postgres -D /var/lib/postgresql/data
priority=1
user=postgres
startretries=3
stdout_logfile=/var/log/postgresql/%(program_name)s.log
stderr_logfile=/var/log/postgresql/%(program_name)s.log

[program:tomcat]
command=/bin/bash -c "exec /launch-xnat.sh"
stdout_logfile=/var/log/tomcat/%(program_name)s.log
stderr_logfile=/var/log/tomcat/%(program_name)s.log

[program:set-admin-password]
command=/bin/sh /set-admin-password.sh
priority=10
autorestart=false
startretries=1
stdout_logfile=/var/log/tomcat/set-admin-password.log
stderr_logfile=/var/log/tomcat/set-admin-password.log
